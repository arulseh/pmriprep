[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmriprep"
version = "0.12.3"
description = "Perfusion MRI Preprocessing Pipeline - A NiPreps-compatible BIDS-App"
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.9"
authors = [
    {name = "PMRIPrep Developers"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    # Core dependencies
    "nipype>=1.8.0",
    "nibabel>=5.0.0",
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "nilearn>=0.10.0",
    # Neuroimaging tools
    "niworkflows>=1.9.0",
    "templateflow>=23.0.0",
    # Config dependencies
    "pyyaml>=6.0",
    "toml>=0.10.0",
    # Report generation
    "jinja2>=3.0",
]

[project.optional-dependencies]
gpu = [
    "cupy>=12.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
dev = [
    "pmriprep[test]",
    "mypy>=1.0.0",
]
all = [
    "pmriprep[gpu,test,dev]",
]

[project.scripts]
pmriprep = "pmriprep.cli.run:main"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (multi-seed noise sweeps, run with --runslow)",
    "publication: marks tests that generate publication figures/tables",
]
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pmriprep*"]

[tool.setuptools.package-data]
pmriprep = ["templates/**/*.html", "data/atlases/**/*.nii.gz"]
