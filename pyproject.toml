[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmriprep"
version = "0.82.0"
description = "Perfusion MRI Preprocessing Pipeline - A NiPreps-compatible BIDS-App"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "PMRIPrep Developers"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    # Core dependencies
    "nipype>=1.8.0",
    "nibabel>=5.0.0",
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "nilearn>=0.10.0",
    # Neuroimaging tools
    "niworkflows>=1.9.0",
    "nitransforms>=21.0.0",
    "h5py>=3.0",
    "pybids>=0.16,<1.0",
    "templateflow>=23.0.0",
    # Parallel worker thread control
    "threadpoolctl>=3.0.0",
    # Config dependencies
    "pyyaml>=6.0",
    "toml>=0.10.0",
    # Report generation
    "jinja2>=3.0",
    # Bundles the pandoc binary for citation-boilerplate rendering (--citeproc)
    "pypandoc-binary>=1.13",
    # QC figures (dce_aif_qc.py uses add_axes(tuple) and mpl.colormaps["…"] subscript, both ≥3.7)
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
dev = [
    "pmriprep[test]",
    "mypy>=1.0.0",
    "ruff>=0.6.0",
]
doc = [
    "sphinx>=6.2",
    "sphinx_rtd_theme>=1.2",
    "sphinx-argparse",
    "sphinxcontrib-apidoc",
    "sphinxcontrib-bibtex",
]
all = [
    "pmriprep[test,dev,doc]",
]

[project.scripts]
pmriprep = "pmriprep.cli.run:main"

[tool.ruff.lint]
# Enforce NumPy-style docstrings (the NiPreps standard) repo-wide. Only the pydocstyle
# (`D`) rules are selected — ruff's default E/F rules are intentionally left off to keep
# this guard scoped to docstring convention. The `convention = "numpy"` setting below
# disables the Google/rST-incompatible D rules; D417 is re-ignored deliberately (see note).
select = ["D"]
ignore = [
    "D105",  # magic-method docstrings (__repr__, etc.)
    "D107",  # __init__ docstring (documented on the class)
    "D417",  # undocumented-param: numpy convention enables this, but inputnode/outputnode
             #   fields live under custom Workflow Inputs/Outputs sections, not Parameters;
             #   param coverage is handled by mypy + review instead
    "D203",  # conflicts with D211 (numpy picks D211)
    "D213",  # conflicts with D212 (numpy picks D212)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pmriprep.workflows.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (multi-seed noise sweeps, run with --runslow)",
    "publication: marks tests that generate publication figures/tables",
]
addopts = "--strict-markers"
testpaths = ["tests"]
doctest_optionflags = "ALLOW_UNICODE NORMALIZE_WHITESPACE ELLIPSIS"

[tool.setuptools.packages.find]
where = ["."]
include = ["pmriprep*"]

[tool.setuptools.package-data]
pmriprep = ["templates/**/*.html", "data/atlases/**/*.nii.gz", "data/*.bib", "data/*.csl"]
