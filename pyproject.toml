[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmriprep"
version = "1.0.0rc5.dev2"
description = "PMRIPrep: automated preprocessing and quantification of DSC and DCE MRI"
readme = "README.md"
license = "Apache-2.0 AND CC0-1.0"
keywords = [
    "neuroimaging",
    "perfusion MRI",
    "dynamic susceptibility contrast MRI",
    "dynamic contrast-enhanced MRI",
    "cerebral perfusion",
    "pharmacokinetic modeling",
    "quantitative MRI",
    "BIDS",
    "reproducible workflows",
]
license-files = ["LICENSE", "NOTICE", "pmriprep/data/atlases/LICENSE-CC0-1.0.txt"]
requires-python = ">=3.11,<3.13"
authors = [
    {name = "PMRIPrep Developers"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    # Core dependencies
    "nipype>=1.8.0",
    "psutil>=5.9.0",
    "nibabel>=5.0.0",
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "scikit-image>=0.20.0",
    "nilearn>=0.10.0",
    # Neuroimaging tools
    "niworkflows>=1.9.0",
    "nitransforms>=21.0.0",
    "h5py>=3.0",
    "pybids>=0.16,<1.0",
    "templateflow>=23.0.0",
    # Parallel worker thread control
    "threadpoolctl>=3.0.0",
    # Config dependencies
    "pyyaml>=6.0",
    "toml>=0.10.0",
    # Report generation
    "jinja2>=3.0",
    # Bundles the pandoc binary for citation-boilerplate rendering (--citeproc)
    "pypandoc-binary>=1.13",
    # QC figures (dce_aif_qc.py uses add_axes(tuple) and mpl.colormaps["…"] subscript, both ≥3.7)
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/arulseh/pmriprep"
Issues = "https://github.com/arulseh/pmriprep/issues"
Repository = "https://github.com/arulseh/pmriprep"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
dev = [
    "pmriprep[test]",
    "mypy>=1.0.0,<1.20",
    "ruff>=0.6.0",
]
doc = [
    "sphinx>=6.2",
    "sphinx_rtd_theme>=1.2",
    "sphinx-argparse",
    "sphinxcontrib-apidoc",
    "sphinxcontrib-bibtex",
]
all = [
    "pmriprep[test,dev,doc]",
]

[project.scripts]
pmriprep = "pmriprep.cli.run:main"

[tool.ruff.lint]
# Enforce core pycodestyle/Pyflakes correctness checks and NumPy-style production
# docstrings. The `convention = "numpy"` setting below disables incompatible
# pydocstyle rules; D417 is re-ignored deliberately (see note).
select = ["D", "E4", "E7", "E9", "F"]
ignore = [
    "D105",  # magic-method docstrings (__repr__, etc.)
    "D107",  # __init__ docstring (documented on the class)
    "D417",  # undocumented-param: numpy convention enables this, but inputnode/outputnode
             #   fields live under custom Workflow Inputs/Outputs sections, not Parameters;
             #   param coverage is handled by mypy + review instead
    "D203",  # conflicts with D211 (numpy picks D211)
    "D213",  # conflicts with D212 (numpy picks D212)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Tests retain their terse no-docstring style while sharing the core correctness
# checks used for production code.
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pmriprep.workflows.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "local_validation: requires non-distributable reference data or local pipeline outputs",
    "synthetic_dro: uses repository-generated synthetic reference data",
    "slow: marks tests as slow (multi-seed noise sweeps, run with --runslow)",
    "publication: marks tests that generate publication figures/tables",
]
addopts = "--strict-markers"
testpaths = ["tests/unit"]
doctest_optionflags = "ALLOW_UNICODE NORMALIZE_WHITESPACE ELLIPSIS"

[tool.setuptools.packages.find]
where = ["."]
include = ["pmriprep*"]

[tool.setuptools.package-data]
pmriprep = ["templates/**/*.html", "data/atlases/**/*.nii.gz", "data/atlases/**/*.md", "data/atlases/**/*.txt", "data/*.bib", "data/*.csl"]
