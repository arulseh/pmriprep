name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install ".[test]"
      - name: Verify installed CLI version
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import toml

          expected = toml.load(pathlib.Path("pyproject.toml"))["project"]["version"]
          actual = subprocess.check_output(
              ["pmriprep", "--version"], text=True,
          ).strip()
          assert actual == f"pmriprep {expected}", (actual, expected)
          PY
      - run: pytest tests/unit/ -q --maxfail=20

  synthetic-dro-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -e ".[test]"
      - run: pytest tests/dro/ -m "not local_validation" -q --maxfail=20

  doctests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -e ".[test]"
      - run: pytest --doctest-modules pmriprep/ -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[doc]"
      - run: python -m sphinx -b html docs docs/_build/html
