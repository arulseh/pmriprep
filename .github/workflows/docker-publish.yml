name: Build and Publish PMRIPrep

on:
  workflow_dispatch:  # manual trigger only

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      # Static version lives in pyproject.toml (no git-tag/semver scheme), so read
      # it directly for an image tag; sanitize the branch name for Docker tag rules.
      - name: Read package version and branch
        id: meta_prep
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "version=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/^version = "([^"]+)".*/\1/')" >> "$GITHUB_OUTPUT"
          echo "branch=${REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata for tagging
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.meta_prep.outputs.version }},enable={{is_default_branch}}
            type=raw,value=${{ steps.meta_prep.outputs.branch }}
            type=sha,prefix=sha-

      # Build and load locally for testing (don't push yet)
      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64   # x86_64 — matches your RHEL server
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha   # cache layers between runs = faster builds
          cache-to: type=gha,mode=max

      # Basic smoke test — confirm the image runs
      - name: Smoke test
        run: |
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run --rm "$IMAGE_TAG" --help

      # Run unit tests inside the container
      - name: Unit tests
        run: |
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run --rm --entrypoint python "$IMAGE_TAG" \
            -m pytest /src/pmriprep/tests/unit/ -v --tb=short

      # Push the already-tested image (no rebuild)
      - name: Push tested image
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
            docker push "$tag"
          done

