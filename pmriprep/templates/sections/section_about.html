<!-- About Section -->
<section id="about">
    <h2>About</h2>
    <div class="section">
        <div class="metrics" style="grid-template-columns: 1fr 1fr;">
            <div class="metric">
                <div class="metric-label">PMRIPrep Version</div>
                <div class="metric-value">{{ version }}</div>
            </div>
            <div class="metric">
                <div class="metric-label">Processing Date</div>
                <div class="metric-value">{{ processing_date }}</div>
            </div>
            {% if command_string %}
            <div class="metric" style="grid-column: 1 / -1;">
                <div class="metric-label">Command</div>
                <div class="metric-value" style="font-family: monospace; font-size: 0.85em; word-break: break-all;">
                    {{ command_string }}
                </div>
            </div>
            {% endif %}
        </div>
    </div>
</section>
