<!-- Methods Section -->
<section id="methods">
    <h2>Methods</h2>
    <div class="section">
        <p style="font-size: 0.85em; color: #666; margin-bottom: 10px;">
            The following text is provided under CC0 license for use in manuscripts.
            <button onclick="copyMethods()" class="copy-btn"
                    style="font-size: 0.9em; padding: 2px 8px; margin-left: 10px;
                           background: #4477AA; color: white; border: none;
                           border-radius: 4px; cursor: pointer;">
                Copy
            </button>
        </p>
        <div id="methods-text" style="background: #fafafa; padding: 15px;
             border-radius: 4px; font-family: Georgia, serif; line-height: 1.7;
             font-size: 0.95em; border: 1px solid #eee;">{{ boilerplate_html }}</div>
    </div>
</section>

<!-- Raw Markdown (with @key citation markers) for the Copy button — JSON-encoded
     so arbitrary boilerplate text round-trips safely into clipboard. -->
<script type="application/json" id="methods-md-data">{{ boilerplate_md | default("") | tojson }}</script>
<script>
function copyMethods() {
    const md = JSON.parse(document.getElementById('methods-md-data').textContent);
    navigator.clipboard.writeText(md).then(() => {
        const btn = document.querySelector('.copy-btn');
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy', 2000);
    });
}
</script>
