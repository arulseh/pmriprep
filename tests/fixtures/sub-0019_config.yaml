# PMRIPrep test configuration for sub-0019/ses-0001
# US-096: cSVD, patlak

# DSC configuration
dsc:
  preload_detected: true
  dose: half
  method: cSVD
  bayesian: none
  aif_criteria: strict
  n_aif_candidates: 10
  save_k2_map: true
  use_gpu: false

# DCE configuration
dce:
  model: patlak
  bayesian: none
  aif_method: auto
  scale_aif: true
  no_b1: false
  no_t1: false
  use_gpu: false

  # Advanced settings from config file
  registration:
    skip_bbr: true

  aif:
    method: auto

  processing:
    tsnr_threshold: 0
