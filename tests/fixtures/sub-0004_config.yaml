# PMRIPrep test configuration for sub-0004/ses-0001
# US-092: gbm preset, extended_tofts bayesian_map
# Note: --dsc-gbm-preset sets: oSVD, pre_bolus=10, aif_criteria=relaxed,
#       n_aif_candidates=5, save_k2_map=true. DSC has NO bayesian.

# DSC configuration (GBM preset values - set via --dsc-gbm-preset CLI flag)
dsc:
  preload_detected: true
  dose: half
  method: oSVD
  bayesian: none
  aif_criteria: relaxed
  n_aif_candidates: 5
  pre_bolus: 10
  save_k2_map: true
  use_gpu: false

# DCE configuration
dce:
  model: extended_tofts
  bayesian: map
  dose: half
  aif_method: auto
  scale_aif: true
  no_b1: false
  no_t1: false
  use_gpu: false

  # Advanced settings from config file
  registration:
    skip_bbr: true

  aif:
    method: auto

  processing:
    tsnr_threshold: 10
