# PMRIPrep test configuration for sub-0020/ses-0001
# US-097: vascular bayesian_map, tofts

# DSC configuration
dsc:
  preload_detected: true
  dose: half
  method: vascular
  bayesian: map
  mcmc_samples: 500
  aif_criteria: strict
  n_aif_candidates: 10
  save_k2_map: true
  save_uncertainty: true
  use_gpu: false

# DCE configuration
dce:
  model: tofts
  bayesian: none
  aif_method: auto
  scale_aif: true
  baseline_frames: 5  # TEMP: match perf-plus to test baseline effect
  no_b1: false
  no_t1: false
  use_gpu: false

  # Advanced settings from config file
  registration:
    skip_bbr: true

  aif:
    method: auto

  processing:
    tsnr_threshold: 0
